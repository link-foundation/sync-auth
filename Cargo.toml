[package]
name = "sync-auth"
version = "0.3.0"
edition = "2021"
description = "Bidirectional auth credential sync for dev tools (Claude Code, GitHub CLI, GitLab CLI, Codex, Gemini CLI, and more) via Git repositories"
readme = "README.md"
license = "Unlicense"
keywords = ["auth", "sync", "credentials", "cli", "devtools"]
categories = ["command-line-utilities", "development-tools", "authentication"]
repository = "https://github.com/link-foundation/auth-sync"
documentation = "https://github.com/link-foundation/auth-sync"
rust-version = "1.70"

[lib]
name = "sync_auth"
path = "src/lib.rs"

[[bin]]
name = "sync-auth"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "process", "fs", "signal"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"
notify = "7"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
serde_yaml_ng = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_lifetimes = "allow"
needless_borrow = "allow"
unnecessary_literal_bound = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
